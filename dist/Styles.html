<style>
:root {
  --primary: #1f3b73;
  --primary-2: #2d5aa8;
  --primary-soft: #e8eef9;
  --accent: #f08c00;
  --bg: #f4f6fa;
  --surface: #ffffff;
  --border: #dde3ee;
  --text: #1d2433;
  --muted: #667085;
  --ok: #2f9e44;
  --ok-soft: #e6f6ea;
  --warn: #e67700;
  --warn-soft: #fff4e0;
  --err: #d6336c;
  --err-soft: #ffe3ec;
  --info-soft: #e7f5ff;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --sidebar: 236px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--primary-2); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.25; }
h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
small, .muted { color: var(--muted); }
code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

/* ---------- Bố cục ---------- */
.boot { display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--muted); font-size: 15px; gap: 10px; }
.topbar { position: sticky; top: 0; z-index: 20; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--primary); color: #fff; box-shadow: var(--shadow); }
.topbar .brand { font-weight: 700; font-size: 16px; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.topbar .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; font-weight: 800; color: #fff; }
.topbar .spacer { flex: 1; }
.topbar .who { text-align: right; line-height: 1.2; font-size: 13px; }
.topbar .who small { color: #c9d6f0; }
.topbar .btn-ghost { color: #fff; border-color: rgba(255, 255, 255, .35); }
.menu-toggle { display: none; background: transparent; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
.layout { display: flex; min-height: calc(100vh - 54px); }
.sidebar { width: var(--sidebar); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 8px 24px; position: sticky; top: 54px; height: calc(100vh - 54px); overflow-y: auto; }
.sidebar .group { margin: 14px 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; color: var(--text); font-weight: 500; }
.sidebar a:hover { background: var(--primary-soft); text-decoration: none; }
.sidebar a.active { background: var(--primary); color: #fff; }
.sidebar a .ico { width: 20px; text-align: center; }
.sidebar a .count { margin-left: auto; background: var(--err); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; }
.main { flex: 1; min-width: 0; padding: 20px 24px 40px; }
.page-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { margin: 0; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Thành phần ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card > h2, .card > h3 { display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: 12.5px; }
.kpi .value { font-size: 24px; font-weight: 700; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi.ok .value { color: var(--ok); } .kpi.warn .value { color: var(--warn); } .kpi.err .value { color: var(--err); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--primary-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-2); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--err); border-color: #f3b5c8; }
.btn.danger:hover { background: var(--err-soft); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn-ghost { background: transparent; }
.btn-link { background: none; border: 0; color: var(--primary-2); cursor: pointer; padding: 0; font: inherit; }

input[type=text], input[type=email], input[type=number], input[type=time], input[type=search], select, textarea {
  font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid #b9cdf2; border-color: var(--primary-2); }
textarea { min-height: 120px; font-family: Consolas, monospace; font-size: 12.5px; }
label { font-weight: 500; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form .full { grid-column: 1 / -1; }
.field label { display: block; margin-bottom: 4px; font-size: 13px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters > * { width: auto; min-width: 140px; }
.filters input, .filters select { width: auto; }
.filters input[type=time] { min-width: 110px; }
.filters input[type=checkbox] { min-width: 0; }
.filters input[type=search] { min-width: 220px; }
.filters > span, .filters > b, .filters > label { min-width: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid #eef1f6; text-align: left; vertical-align: top; }
.tbl th { background: #f7f9fc; font-weight: 600; color: #475467; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
.tbl tr:hover td { background: #fafbfe; }
.tbl tr.clickable { cursor: pointer; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl .nowrap { white-space: nowrap; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef1f6; color: #475467; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.err { background: var(--err-soft); color: var(--err); }
.badge.info { background: var(--info-soft); color: #1971c2; }
.badge.primary { background: var(--primary-soft); color: var(--primary); }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; background: #f1f3f8; font-size: 12.5px; margin: 2px 4px 2px 0; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }

.alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; border: 1px solid transparent; }
.alert.err { background: var(--err-soft); border-color: #f7c1d3; }
.alert.warn { background: var(--warn-soft); border-color: #ffd8a8; }
.alert.info { background: var(--info-soft); border-color: #a5d8ff; }
.alert.ok { background: var(--ok-soft); border-color: #b2f2bb; }

.bar { position: relative; height: 8px; background: #edf0f5; border-radius: 6px; overflow: hidden; min-width: 80px; }
.bar > span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--primary-2); }
.bar.ok > span { background: var(--ok); } .bar.high > span { background: var(--warn); } .bar.over > span { background: var(--err); } .bar.low > span, .bar.none > span { background: #adb5bd; }
.bar .target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #1d2433; opacity: .5; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; padding: 8px 14px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.split > *, .grid > * { min-width: 0; }
.week-wrap { overflow-x: auto; }
.picker { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: sticky; top: 70px; }
.picker .search { padding: 10px; border-bottom: 1px solid var(--border); display: grid; gap: 6px; }
.picker .items { max-height: calc(100vh - 210px); overflow-y: auto; }
.picker .item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f3f7; }
.picker .item:hover { background: #f7f9fc; }
.picker .item.active { background: var(--primary-soft); }
.picker .item .name { font-weight: 500; }
.picker .item .meta { font-size: 12px; color: var(--muted); }
.picker .item .right { margin-left: auto; text-align: right; font-size: 12px; }

/* ---------- Lưới lịch tuần ---------- */
.week { display: grid; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.week .col-head { background: #f7f9fc; border-bottom: 1px solid var(--border); padding: 8px; font-weight: 600; text-align: center; font-size: 13px; }
.week .col-head small { display: block; font-weight: 400; }
.week .axis { position: relative; border-right: 1px solid var(--border); }
.week .axis span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
.week .day { position: relative; border-right: 1px solid #eef1f6; }
.week .day:last-child { border-right: 0; }
.week .hline { position: absolute; left: 0; right: 0; border-top: 1px dashed #eef1f6; }
.ev { position: absolute; border-radius: 6px; padding: 3px 5px; font-size: 11.5px; line-height: 1.25; overflow: hidden; cursor: pointer; background: #eef3fc; border-left: 4px solid var(--primary-2); box-shadow: 0 1px 1px rgba(0, 0, 0, .06); }
.ev:hover { z-index: 5; box-shadow: 0 3px 10px rgba(0, 0, 0, .18); }
.ev b { display: block; font-size: 11px; }
.ev .t2 { color: #475467; }
.ev.unassigned { background: repeating-linear-gradient(45deg, #fff, #fff 6px, #f5f6f8 6px, #f5f6f8 12px); border: 1px dashed #98a2b3; border-left-width: 4px; }
.ev.error { outline: 2px solid var(--err); background: var(--err-soft); }
.ev.warning { outline: 2px solid #f59f00; }
.ev.busy { background: repeating-linear-gradient(45deg, #f1f3f5, #f1f3f5 5px, #e9ecef 5px, #e9ecef 10px); border-left-color: #868e96; cursor: default; color: #495057; }
.ev .lock { position: absolute; right: 3px; top: 2px; font-size: 10px; }

/* ---------- Lịch trống ---------- */
.tl-row { display: grid; grid-template-columns: 230px minmax(0, 1fr) 90px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f3f7; }
.tl-row .who { font-size: 13px; }
.tl-row .who .name { font-weight: 600; cursor: pointer; }
.tl { position: relative; height: 26px; background: var(--ok-soft); border-radius: 6px; overflow: hidden; }
.tl .seg { position: absolute; top: 0; bottom: 0; font-size: 10.5px; color: #fff; padding: 0 3px; overflow: hidden; white-space: nowrap; line-height: 26px; }
.tl .seg.lesson { background: var(--primary-2); }
.tl .seg.unavailable { background: #868e96; }
.tl .query { position: absolute; top: 0; bottom: 0; border: 2px solid var(--accent); border-radius: 4px; pointer-events: none; }
.tl-scale { position: relative; height: 16px; margin-left: 240px; margin-right: 100px; font-size: 11px; color: var(--muted); }
.tl-scale span { position: absolute; transform: translateX(-50%); }
.tl-row.fits .who .name::after { content: " ✓"; color: var(--ok); }

/* ---------- Modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(16, 24, 40, .45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.modal.wide { max-width: 980px; }
.modal .m-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.modal .m-head h3 { margin: 0; font-size: 16px; }
.modal .m-head .x { margin-left: auto; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); }
.modal .m-body { padding: 16px 18px; max-height: calc(100vh - 220px); overflow-y: auto; }
.modal .m-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
#toast-root { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: grid; gap: 8px; }
.toast { background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); max-width: 420px; animation: slidein .2s ease-out; }
.toast.err { background: var(--err); } .toast.ok { background: var(--ok); } .toast.warn { background: var(--warn); }
@keyframes slidein { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.spinner { width: 18px; height: 18px; border: 3px solid #d0d7e6; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { padding: 40px; text-align: center; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }

/* ---------- Đăng nhập ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(135deg, #1f3b73 0%, #2d5aa8 60%, #f08c00 160%); }
.login { background: #fff; border-radius: 14px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.login h1 { color: var(--primary); }
.login .stack { display: grid; gap: 12px; margin-top: 16px; }

.explain { font-size: 12px; color: #475467; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.rules li { margin-bottom: 4px; }
.stat-line { display: flex; gap: 6px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.scroll-box { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.row-err td { background: var(--err-soft) !important; }

@media (max-width: 1100px) {
  .grid.cols-3 { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .picker { position: static; }
  .picker .items { max-height: 260px; }
}
@media (max-width: 820px) {
  .menu-toggle { display: block; }
  .sidebar { position: fixed; left: 0; top: 54px; bottom: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  .main { padding: 14px 12px 40px; }
  .grid.cols-2, .grid.cols-3, .form { grid-template-columns: minmax(0, 1fr); }
  .page-head .actions { margin-left: 0; }
  .filters > * { min-width: 0; flex: 1 1 140px; }
  .topbar .who small { display: none; }
  .tl-row { grid-template-columns: 1fr; }
  .tl-scale { display: none; }
}
@media print {
  .topbar, .sidebar, .actions, .filters, .picker, .no-print, .tabs { display: none !important; }
  .main { padding: 0; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .card { box-shadow: none; border: 0; }
  body { background: #fff; }
  .ev { box-shadow: none; }
}
</style>
